schemaVersion: 1
name: tastebook
alias: Tastebook

repositories:
  - owner: Milo-Bedini
    name: tastebook
    reviewers:
      - milobedini
    # PRs land through GitHub's merge queue (docs/merge-queue.md).
    mergeQueue: true

# The design stage: a spec that says `Design: needed` is drawn on a claude.ai canvas by this routine before implement
# (plugin/agents/design.md). Its token is the console's DESIGN_ROUTINE_TOKEN. Canvases draw with the Dino Design
# System, which a design run rebuilds from main with `build` and republishes when it's behind.
design:
  routine: trig_015ytNVnxYsCys81Mnm6A8N4
  system:
    url: https://claude.ai/artifact/Log29Ws2J3fTumoXaxVr1C
    build: pnpm dino:bundle
    out: frontend/dino-bundle

linear:
  teamKey: TAS
  statuses:
    researching: Researching
    spec: Spec
    specReview: Spec Review
    design: Design
    designReview: Design Review
    building: Building
    inReview: In Review
    awaitingMerge: Awaiting Merge
    done: Done
    canceled: Canceled

timeZone: Europe/London

# Said in Approve and merge's confirm dialog in Slack: Vercel deploys main to production.
mergeEffect: deploys it to production

# Work goes express (no spec; implement asks first; review never asks) unless its issue is labelled `careful`
# (docs/express.md in mb-factory). The person still merges.
track: express

# Who merges an express PR: the factory once its checks pass, unless one of these sends it to the person. Until
# auto-merge is on, Ready to merge only says which way each PR would go. Globs are from the repo root; one ending in `/`
# takes the whole folder.
express:
  merge:
    # The factory merges what the rules leave to it, as its App: the rulesets in rulesets/ let the App merge without an
    # approval, and the console holds its key (FACTORY_APP_PRIVATE_KEY).
    auto: true
    # More than either, counting source only, waits for the person.
    size:
      lines: 400
      files: 20
    # Not counted in the size: generated output, data, docs, specs and baselines (tests never count either).
    uncounted:
      - "**/*.md"
      - docs/
      - specs/
      - pnpm-lock.yaml
      - backend/uv.lock
      - backend/schema.yml
      - frontend/src/api/schema.d.ts
      - backend/recipes/catalogue*.json
      - frontend/visual/baselines/
      - frontend/dino-bundle/
    # Deleting a test, or adding a skip to one, waits for the person.
    tests:
      - "**/*.test.{ts,tsx}"
      - "**/*.spec.ts"
      - frontend/e2e/
      - frontend/src/test/
      - backend/tests/
    # Lint, type and test settings and thresholds. pyproject.toml is left out: it holds the dependencies too.
    safetyNet:
      - biome.json
      - tools/biome/
      - "**/tsconfig*.json"
      - frontend/vite.config.ts
      - frontend/vitest.config.ts
      - frontend/playwright*.config.ts
      - frontend/lighthouserc.json
      - backend/ruff.toml
      - backend/tests/conftest.py
    # Risky paths: every migration (production database changes are approved each time), auth and session code,
    # settings, CI workflows. `backend/config/urls.py` is left out: most new endpoints add a line to it.
    humanMerge:
      - backend/*/migrations/
      - backend/config/settings.py
      - backend/config/sentry.py
      - backend/config/asgi.py
      - backend/config/wsgi.py
      - backend/households/adapter.py
      - backend/households/admin_site.py
      - frontend/src/households/auth-api.ts
      - frontend/src/households/session-api.ts
      - frontend/src/households/sign-in-*.{ts,tsx}
      - frontend/src/households/safe-next-path.ts
      - .github/
      - vercel.json

# Credited as co-author on the factory's commits for issues assigned to them, and mentioned in Slack when one waits
# on them. `git` is GitHub's noreply address, so the commits count on their profile without publishing an email;
# `slack` is their member ID (profile → ⋮ → Copy member ID); `github` is their GitHub user ID
# (`gh api users/<login> --jq .id`), which lets them connect GitHub and approve and merge PRs from Slack.
people:
  - linear: milobedini64@gmail.com
    git: Milo Bedini <89992629+milobedini@users.noreply.github.com>
    slack: U0CBS3FN806
    github: 89992629

slack:
  channel: "#tastebook-factory"
  channelId: C0CBSE2Q6FQ
  allowedUserIds:
    - U0CBS3FN806 # Milo
  emojiPrefix: tb

models:
  triage: sonnet
  slicing: opus
  spec: opus
  implement: opus
  review: opus
  # Answers `/tastebook ask`.
  ask: sonnet

review:
  maxRounds: 2

# Run by the stage's hooks: `edit` on each file the agent edits, its errors handed straight back; `stop` before the stage
# agent may finish, for each area its branch changed (at most three times a run).
checks:
  fast:
    edit:
      - paths: [frontend/, tools/]
        run: pnpm exec biome check --no-errors-on-unmatched {file}
      - paths: [backend/]
        extensions: [py]
        dir: backend
        run: uv run ruff check {file} && uv run ruff format --check {file}
    stop:
      - paths: [frontend/]
        run: pnpm --filter frontend type-check && pnpm --filter frontend exec vitest run --project unit --changed origin/main
      - paths: [backend/]
        dir: backend
        run: uv run pytest -x -q

# The console's own daily check: warnings and errors, stuck runs, late jobs. Not a Claude run.
health:
  at: "07:00"

# New unresolved issues here show in the health check. The organisation is hosted in the EU.
sentry:
  url: https://de.sentry.io
  organisation: milo-bedini
  projects:
    - sentry-gray-fountain

# Previews get their databases here, from the Neon-managed Vercel integration; a closed PR's is deleted.
neon:
  project: green-resonance-43539979

jobs:
  - name: security
    agent: security
    at: "06:00"
    model: sonnet
  - name: docs
    agent: docs
    at: "06:30"
    model: sonnet
  - name: security-weekly
    agent: security
    day: monday
    at: "05:00"
    scope: repo
    model: sonnet
  - name: docs-weekly
    agent: docs
    day: monday
    at: "05:30"
    scope: repo
    model: sonnet
  # Express step 4: the week's drift swept in one pass, and what reviews raised twice turned into checks.
  - name: cleanup
    agent: cleanup
    day: monday
    at: "07:00"
    scope: repo
    model: sonnet
