schemaVersion: 1
name: tastebook
alias: Tastebook

repositories:
  - owner: milobedini
    name: tastebook
    reviewers:
      - milobedini

linear:
  teamKey: TAS
  statuses:
    researching: Researching
    spec: Spec
    specReview: Spec Review
    building: Building
    inReview: In Review
    awaitingMerge: Awaiting Merge
    done: Done
    canceled: Canceled

timeZone: Europe/London

slack:
  channel: "#tastebook-factory"
  channelId: C0CBSE2Q6FQ
  allowedUserIds:
    - U0CBS3FN806 # Milo

models:
  triage: sonnet
  slicing: opus
  spec: opus
  implement: opus
  review: opus

review:
  maxRounds: 2

concurrency:
  maxRuns: 2

usage:
  fiveHour:
    throttleAt: 0.6
    pauseAt: 0.8
  sevenDay:
    pacing: true
    slack: 0.1
    pauseAt: 0.85
  staleAfterMinutes: 20
  downshift:
    triage: haiku
    review: sonnet

# The console's own daily check: warnings and errors, stuck runs, late jobs. Not a Claude run.
health:
  at: "07:00"

jobs:
  - name: security
    agent: security
    at: "06:00"
    model: sonnet
  - name: docs
    agent: docs
    at: "06:30"
    model: sonnet
  - name: security-weekly
    agent: security
    day: monday
    at: "05:00"
    scope: repo
    model: sonnet
  - name: docs-weekly
    agent: docs
    day: monday
    at: "05:30"
    scope: repo
    model: sonnet
