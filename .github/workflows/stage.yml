# One factory stage run. Project repos call this from a repository_dispatch workflow; the console sends the dispatch.
name: Factory stage

on:
  workflow_call:
    inputs:
      run_id:
        description: The console's run ID
        type: string
        required: true
      model:
        description: Model for the run, from factory.yaml (after any governor downshift)
        type: string
        required: true
      prompt:
        description: The dispatcher prompt with the brief, rendered by the console
        type: string
        required: true
      factory_ref:
        description: Ref of mb-factory whose plugin the run loads
        type: string
        default: main
      console_url:
        type: string
        default: https://mb-factory-console.vercel.app
    secrets:
      # Not required here: once the project keeps it in its `factory` environment, the caller passes an empty value
      # and the environment's wins. The input check fails the run when neither has it.
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      # The project's own GitHub App, which can push workflow files (Anthropic's Claude app can't). Only implement runs
      # use it; other runs, and every run without both, use the Claude app through the action's OIDC exchange.
      FACTORY_APP_CLIENT_ID:
        required: false
      FACTORY_APP_PRIVATE_KEY:
        required: false
      # A read-write token for the project's public Blob store of PR visuals. Only the evidence job reads it: the stage
      # job, where the agent runs with sudo, never references it.
      EVIDENCE_BLOB_READ_WRITE_TOKEN:
        required: false
      # A person's fine-grained token (contents and pull requests: read and write, on the project's repo only), which
      # attaches a walkthrough to the PR so it plays there. GitHub refuses attachments from an app's token. Only the
      # evidence job reads it; without it the walkthrough stays a link.
      EVIDENCE_ATTACH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    # Above the longest stage limit (implement's) by enough for the setup before it and the report after.
    timeout-minutes: 110
    # The project keeps the stage's secrets (the Claude token, the factory app's key) in an environment limited to its
    # default branch, so a workflow pushed to any other branch can't read them. Stage runs come from repository_dispatch,
    # which runs on the default branch. Until the environment holds them, the repository's secrets are used.
    environment: factory
    concurrency:
      group: factory-run-${{ inputs.run_id }}
    outputs:
      agent: ${{ steps.start.outputs.agent }}
    permissions:
      contents: read
      # Authenticates to the console and to the Claude GitHub App token exchange.
      id-token: write
    env:
      RUN_ID: ${{ inputs.run_id }}
      MODEL: ${{ inputs.model }}
      FACTORY_REF: ${{ inputs.factory_ref }}
      CONSOLE_URL: ${{ inputs.console_url }}
      HAS_FACTORY_APP: ${{ secrets.FACTORY_APP_CLIENT_ID != '' && secrets.FACTORY_APP_PRIVATE_KEY != '' }}
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Check the inputs
        run: |
          [[ "$RUN_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "::error::run_id is not a UUID"; exit 1; }
          [[ "$MODEL" =~ ^[a-z0-9.-]+$ ]] || { echo "::error::model has unexpected characters"; exit 1; }
          [[ "$FACTORY_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::factory_ref has unexpected characters"; exit 1; }
          [[ "$CONSOLE_URL" =~ ^https://[A-Za-z0-9.-]+$ ]] || { echo "::error::console_url must be an https origin"; exit 1; }
          [[ "$HAS_CLAUDE_TOKEN" == true ]] || { echo "::error::CLAUDE_CODE_OAUTH_TOKEN is in neither the factory environment nor the repository"; exit 1; }
          echo "FACTORY_REPORT_PATH=$RUNNER_TEMP/factory-report.json" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the factory plugin
        run: git clone --quiet --depth 1 --branch "$FACTORY_REF" https://github.com/milobedini/mb-factory.git "$RUNNER_TEMP/mb-factory"

      - name: Start the run
        id: start
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          audience=$(jq -rn --arg url "$CONSOLE_URL" '$url | @uri')
          oidc=$(curl -sS --fail-with-body --retry 3 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" | jq -r .value)
          echo "::add-mask::$oidc"
          response=$(curl -sS --fail-with-body -X POST -H "Authorization: Bearer $oidc" "$CONSOLE_URL/api/runs/$RUN_ID/start")
          agent=$(jq -r '.agent // empty' <<< "$response")
          echo "agent=$agent" >> "$GITHUB_OUTPUT"
          # For the plugin's hooks (plugin/hooks): the project's fast checks as one line of JSON, the stage agent, and
          # the branch nothing may be pushed to.
          [[ "$agent" =~ ^[a-z]+$ && "$DEFAULT_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::unexpected agent or default branch"; exit 1; }
          {
            echo "FACTORY_AGENT=$agent"
            echo "FACTORY_BASE=$DEFAULT_BRANCH"
            echo "FACTORY_CHECKS=$(jq -c '.checks // empty' <<< "$response")"
          } >> "$GITHUB_ENV"
          # A conflict fix: what the merge step needs to try merging the base branch in without the agent.
          # Each value is checked before it's written, so none can add a line of its own to the step's outputs.
          merge=$(jq -c '.merge // empty' <<< "$response")
          if [[ -n "$merge" ]]; then
            pr=$(jq -r '.pr' <<< "$merge")
            branch=$(jq -r '.branch' <<< "$merge")
            base=$(jq -r '.base' <<< "$merge")
            co_author=$(jq -r '.coAuthor // empty' <<< "$merge")
            if [[ "$pr" =~ ^[0-9]+$ && "$branch" =~ ^[A-Za-z0-9._/-]+$ && "$base" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              {
                echo "merge_pr=$pr"
                echo "merge_branch=$branch"
                echo "merge_base=$base"
              } >> "$GITHUB_OUTPUT"
              if [[ "$co_author" =~ ^[A-Za-z0-9\ ._\'-]+\ \<[A-Za-z0-9._+@-]+\>$ ]]; then
                echo "merge_co_author=$co_author" >> "$GITHUB_OUTPUT"
              fi
            fi
          fi
          # A scheduled job's run reports only to the console, so it gets no Linear token or session; a question gets no
          # token either, only a pass to read Linear through the console, which forwards queries and nothing else.
          linear_token=$(jq -r '.linearAccessToken // empty' <<< "$response")
          if [[ -n "$linear_token" ]]; then
            echo "::add-mask::$linear_token"
            {
              echo "LINEAR_ACCESS_TOKEN=$linear_token"
              echo "LINEAR_AGENT_SESSION_ID=$(jq -r '.agentSessionId // empty' <<< "$response")"
            } >> "$GITHUB_ENV"
          fi
          linear_pass=$(jq -r '.linearPass // empty' <<< "$response")
          if [[ -n "$linear_pass" ]]; then
            echo "::add-mask::$linear_pass"
            {
              echo "LINEAR_PROXY_URL=$CONSOLE_URL/api/runs/$RUN_ID/linear"
              echo "LINEAR_PROXY_PASS=$linear_pass"
            } >> "$GITHUB_ENV"
          fi

      - name: Set up the project
        # A question or a size run only reads the code, so it skips installing the toolchains and starting Postgres.
        if: hashFiles('.github/actions/factory-setup/action.yml') != '' && steps.start.outputs.agent != 'ask' && steps.start.outputs.agent != 'size'
        uses: ./.github/actions/factory-setup

      - name: Get the factory app's token
        id: app-token
        # Triage, spec, review and the scheduled checks read the most untrusted text and never need to write workflows.
        if: env.HAS_FACTORY_APP == 'true' && steps.start.outputs.agent == 'implement'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write
          permission-actions: read
          permission-checks: read
          permission-statuses: read

      - name: Prepare the evidence folder
        # Implement records a PR's screens or walkthrough here and writes the visual's URL into the PR; the evidence job
        # builds the visual and uploads it after this job ends. The URL is fixed by the store, the repo and the run, so
        # no token is needed to know it. Without a store, implement makes no visual.
        if: steps.start.outputs.agent == 'implement'
        env:
          STORE: ${{ vars.EVIDENCE_BLOB_STORE_ID }}
        run: |
          [[ "$STORE" =~ ^[A-Za-z0-9]+$ ]] || { echo "::warning::EVIDENCE_BLOB_STORE_ID is not set in the factory environment: no visual"; exit 0; }
          mkdir -p "$RUNNER_TEMP/evidence"
          {
            echo "EVIDENCE_DIR=$RUNNER_TEMP/evidence"
            echo "EVIDENCE_URL_PREFIX=https://${STORE,,}.public.blob.vercel-storage.com/$GITHUB_REPOSITORY/$RUN_ID/"
          } >> "$GITHUB_ENV"

      - name: Name the factory app's bot
        id: bot
        # Its commits show the project's own factory bot rather than github-actions[bot].
        if: steps.app-token.outcome == 'success'
        # Without it the commits keep the action's default name; the run goes on.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          id=$(gh api "users/${SLUG}%5Bbot%5D" --jq .id)
          [[ "$id" =~ ^[0-9]+$ ]] || { echo "::error::No bot user for the app $SLUG"; exit 1; }
          echo "name=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Merge the base branch in without the agent
        id: merge
        # A conflict fix where only lockfiles conflict needs no agent: take the base branch's lockfile, regenerate it
        # from the merged manifests with its package manager, and let CI judge. Any other conflict, an unknown lockfile
        # or a step that fails puts the checkout back as it was, and the agent resolves it as before.
        if: steps.start.outputs.merge_branch != '' && steps.app-token.outcome == 'success' && steps.bot.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.start.outputs.merge_pr }}
          BRANCH: ${{ steps.start.outputs.merge_branch }}
          BASE: ${{ steps.start.outputs.merge_base }}
          CO_AUTHOR: ${{ steps.start.outputs.merge_co_author }}
          BOT_NAME: ${{ steps.bot.outputs.name }}
          BOT_ID: ${{ steps.bot.outputs.id }}
        run: |
          # Where the checkout started, so a give-up leaves the agent the same checkout it has always had.
          start=$(git symbolic-ref --quiet --short HEAD || git rev-parse HEAD)
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          give_up() {
            echo "Leaving the merge to the agent: $1"
            git merge --abort 2> /dev/null || true
            git reset --quiet --hard
            git checkout --quiet "$start"
            git branch --quiet -D "$BRANCH" 2> /dev/null || true
            exit 0
          }
          # Anything failing unexpectedly gives up the same way, so the agent never starts mid-merge.
          set -E
          trap 'give_up "a command failed on line $LINENO"' ERR
          relock() {
            case "$(basename "$1")" in
              pnpm-lock.yaml) (cd "$(dirname "$1")" && pnpm install --lockfile-only --ignore-scripts) ;;
              package-lock.json) (cd "$(dirname "$1")" && npm install --package-lock-only --ignore-scripts) ;;
              uv.lock) (cd "$(dirname "$1")" && uv lock) ;;
              *) return 1 ;;
            esac
          }
          git fetch --quiet "$remote" "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" "+refs/heads/$BASE:refs/remotes/origin/$BASE" \
            || give_up "couldn't fetch $BRANCH and $BASE"
          git checkout --quiet -B "$BRANCH" "origin/$BRANCH" || give_up "couldn't check out $BRANCH"
          git merge --no-ff --no-commit "origin/$BASE" > /dev/null 2>&1 || true
          conflicted=()
          while IFS= read -r file; do conflicted+=("$file"); done < <(git diff --name-only --diff-filter=U)
          [[ ${#conflicted[@]} -gt 0 ]] || give_up "nothing conflicts, so GitHub's merge state may be stale"
          for file in "${conflicted[@]}"; do
            git checkout --quiet --theirs -- "$file" || give_up "couldn't take $BASE's $file"
            relock "$file" || give_up "$file isn't a lockfile this step can regenerate"
            git add -- "$file"
          done
          # The package managers write only their lockfiles, now staged: a change left unstaged is a reason to stop.
          git diff --quiet || give_up "regenerating changed more than the lockfiles"
          message="Merge $BASE into $BRANCH, regenerating ${conflicted[*]}"
          identity=(-c "user.name=$BOT_NAME" -c "user.email=${BOT_ID}+${BOT_NAME}@users.noreply.github.com")
          if [[ -n "$CO_AUTHOR" ]]; then
            git "${identity[@]}" commit --quiet -m "$message" -m "Co-authored-by: $CO_AUTHOR" || give_up "couldn't commit the merge"
          else
            git "${identity[@]}" commit --quiet -m "$message" || give_up "couldn't commit the merge"
          fi
          git push --quiet "$remote" "HEAD:refs/heads/$BRANCH" \
            || give_up "couldn't push $BRANCH (it may have moved)"
          # shellcheck disable=SC2016 # the backticks are Markdown for the PR comment
          files=$(printf '`%s`, ' "${conflicted[@]}")
          files=${files%, }
          gh pr comment "$PR" --body "Merged \`$BASE\` in without an agent: only ${files} conflicted, so each was taken from \`$BASE\` and regenerated from the merged manifests with its package manager. CI checks the result." \
            || echo "::warning::Couldn't comment on PR #$PR"
          jq -n --argjson pr "$PR" --arg branch "$BRANCH" --arg summary "Merged $BASE into PR #$PR without an agent: only ${conflicted[*]} conflicted, so each was regenerated from the merged manifests. CI checks the result." \
            '{stage: "implement", outcome: "done", summary: $summary, next: "review", pr: $pr, branch: $branch}' > "$FACTORY_REPORT_PATH"
          echo "merged=true" >> "$GITHUB_OUTPUT"

      # When the stage step started and how long it may run, so the report can tell a run stopped at its limit from one
      # whose agent never started. Implement builds the whole change, so it gets longer than the others.
      - name: Time the stage
        id: timing
        if: steps.merge.outputs.merged != 'true'
        env:
          AGENT: ${{ steps.start.outputs.agent }}
        run: |
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "limit=$([[ "$AGENT" == implement ]] && echo 100 || echo 50)" >> "$GITHUB_OUTPUT"

      # The action downloads Bun from github.com's release downloads on every run, and those answered 504 for over an
      # hour on 8 Nov while the API and the rest of GitHub worked. So the stage keeps the action's own Bun version in the
      # Actions cache, fetched through the API when missing and checked against Bun's checksums on every run, and hands
      # it to the action. If any of these steps fails, the action installs Bun itself as before.
      - name: Find the action's Bun version
        id: bun
        if: steps.merge.outputs.merged != 'true'
        continue-on-error: true
        run: |
          # The runner downloads each action the job uses before the first step, so this job's one copy is already here.
          shopt -s nullglob
          files=("$(dirname "$RUNNER_WORKSPACE")"/_actions/anthropics/claude-code-action/*/action.yml)
          [[ ${#files[@]} -eq 1 ]] || { echo "::warning::Found ${#files[@]} copies of claude-code-action: it installs its own Bun"; exit 1; }
          version=$(sed -n 's/^ *bun-version: *\([0-9.]*\).*$/\1/p' "${files[0]}" | head -1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::warning::No Bun version in claude-code-action: it installs its own"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Bun from the cache
        id: bun-cache
        if: steps.bun.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bun-cache
          key: bun-${{ steps.bun.outputs.version }}-linux-x64

      - name: Unpack Bun
        id: bun-unpack
        if: steps.bun.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bun.outputs.version }}
        run: |
          cache="$RUNNER_TEMP/bun-cache"
          mkdir -p "$cache"
          asset() {
            id=$(gh api "repos/oven-sh/bun/releases/tags/bun-v$VERSION" --jq ".assets[] | select(.name == \"$1\") | .id")
            [[ "$id" =~ ^[0-9]+$ ]] || return 1
            gh api -H 'Accept: application/octet-stream' "repos/oven-sh/bun/releases/assets/$id" > "$cache/$1"
          }
          asset SHASUMS256.txt
          check() { (cd "$cache" && grep ' bun-linux-x64.zip$' SHASUMS256.txt | sha256sum --check --status); }
          if ! check; then
            echo "Fetching Bun $VERSION through the API"
            asset bun-linux-x64.zip
            check || { echo "::warning::Bun $VERSION doesn't match its checksum: the action installs its own"; exit 1; }
            echo "fetched=true" >> "$GITHUB_OUTPUT"
          fi
          unzip -q -o -j "$cache/bun-linux-x64.zip" bun-linux-x64/bun -d "$RUNNER_TEMP/bun"
          [[ "$("$RUNNER_TEMP/bun/bun" --version)" == "$VERSION" ]] || { echo "::warning::The unpacked Bun isn't $VERSION"; exit 1; }
          echo "path=$RUNNER_TEMP/bun/bun" >> "$GITHUB_OUTPUT"

      - name: Keep Bun in the cache
        if: steps.bun-unpack.outputs.fetched == 'true' && steps.bun-unpack.outputs.path != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bun-cache
          key: bun-${{ steps.bun.outputs.version }}-linux-x64

      - name: Run the stage
        id: claude
        if: steps.merge.outputs.merged != 'true'
        timeout-minutes: ${{ fromJSON(steps.timing.outputs.limit) }}
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Empty without the factory app, which leaves the action to its own OIDC exchange.
          github_token: ${{ steps.app-token.outputs.token }}
          # The action's own defaults when there's no factory app.
          bot_id: ${{ steps.bot.outputs.id || '41898282' }}
          bot_name: ${{ steps.bot.outputs.name || 'claude[bot]' }}
          # Empty when the cached Bun couldn't be made ready, which leaves the action to download its own.
          path_to_bun_executable: ${{ steps.bun-unpack.outputs.path }}
          prompt: ${{ inputs.prompt }}
          claude_args: |
            --model ${{ inputs.model }}
            --plugin-dir ${{ runner.temp }}/mb-factory/plugin
            --allowedTools Agent,Bash,Read,Edit,Write,Glob,Grep,Skill,TodoWrite

      - name: Write the run's report
        if: always() && steps.start.outcome == 'success'
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          STAGE_STARTED: ${{ steps.timing.outputs.started }}
          STAGE_LIMIT: ${{ steps.timing.outputs.limit }}
        run: |
          events='[]'
          if [[ -n "$EXECUTION_FILE" && -f "$EXECUTION_FILE" ]]; then
            # The file has been a JSON array; accept JSON lines too. Keep only the events the console reads, without message text.
            events=$(jq -cs 'if length == 1 and (.[0] | type) == "array" then .[0] else . end
              | [.[] | select(.type == "rate_limit_event" or .type == "result") | del(.result, .permission_denials)]' "$EXECUTION_FILE")
          fi
          report=null
          if [[ -f "$FACTORY_REPORT_PATH" && $(stat -c %s "$FACTORY_REPORT_PATH") -lt 1000000 ]] && jq -e . "$FACTORY_REPORT_PATH" > /dev/null 2>&1; then
            report=$(jq -c . "$FACTORY_REPORT_PATH")
          fi
          seconds=null
          limit=null
          if [[ "$STAGE_STARTED" =~ ^[0-9]+$ && "$STAGE_LIMIT" =~ ^[0-9]+$ ]]; then
            seconds=$(( $(date +%s) - STAGE_STARTED ))
            limit=$STAGE_LIMIT
          fi
          jq -n --arg conclusion "$CONCLUSION" --argjson report "$report" --argjson events "$events" \
            --argjson seconds "$seconds" --argjson limit "$limit" \
            '{conclusion: $conclusion, report: $report, events: $events, stageSeconds: $seconds, timeoutMinutes: $limit}' > "$RUNNER_TEMP/run-report.json"

      - name: Report the run
        # An implement run reports from the evidence job, once its visual is up, so the PR and Slack never show a
        # broken image.
        if: always() && steps.start.outcome == 'success' && steps.start.outputs.agent != 'implement'
        run: |
          audience=$(jq -rn --arg url "$CONSOLE_URL" '$url | @uri')
          oidc=$(curl -sS --fail-with-body --retry 3 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" | jq -r .value)
          echo "::add-mask::$oidc"
          curl -sS --fail-with-body -X POST -H "Authorization: Bearer $oidc" -H 'Content-Type: application/json' \
            --data @"$RUNNER_TEMP/run-report.json" "$CONSOLE_URL/api/runs/$RUN_ID/report"

      - name: Keep the report and recordings for the evidence job
        if: always() && steps.start.outcome == 'success' && steps.start.outputs.agent == 'implement'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ inputs.run_id }}
          path: |
            ${{ runner.temp }}/run-report.json
            ${{ runner.temp }}/evidence/
          retention-days: 1

  # Builds an implement run's visual from what it recorded, on a runner holding no secret: ImageMagick and ffmpeg read
  # files the agent made, so whatever they might be made to do can reach nothing. Hands on only the finished files.
  visual:
    needs: stage
    if: always() && needs.stage.outputs.agent == 'implement'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      recorded: ${{ steps.build.outputs.recorded }}
      built: ${{ steps.build.outputs.built }}
    env:
      FACTORY_REF: ${{ inputs.factory_ref }}
    steps:
      - name: Get the recordings
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evidence-${{ inputs.run_id }}
          path: ${{ runner.temp }}/stage

      - name: Build the visual
        id: build
        if: steps.download.outcome == 'success'
        # The run's report goes on without it, saying so.
        continue-on-error: true
        run: |
          # A PR that changes nothing on screen has no visual.json, and gets no visual.
          [[ -f "$RUNNER_TEMP/stage/evidence/visual.json" ]] || { echo "Implement recorded no visual."; exit 0; }
          echo "recorded=true" >> "$GITHUB_OUTPUT"
          [[ "$FACTORY_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::factory_ref has unexpected characters"; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends imagemagick ffmpeg fonts-dejavu-core > /dev/null
          git clone --quiet --depth 1 --branch "$FACTORY_REF" https://github.com/milobedini/mb-factory.git "$RUNNER_TEMP/mb-factory"
          mkdir -p "$RUNNER_TEMP/visual"
          bash "$RUNNER_TEMP/mb-factory/.github/scripts/visual.sh" "$RUNNER_TEMP/stage/evidence" "$RUNNER_TEMP/visual/files" > "$RUNNER_TEMP/visual/visual.json"
          cat "$RUNNER_TEMP/visual/visual.json"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Keep the visual for the evidence job
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-${{ inputs.run_id }}
          path: ${{ runner.temp }}/visual/
          retention-days: 1

  # Uploads an implement run's visual, on a fresh runner the agent never touched: nothing it wrote to the stage job's
  # environment, and no process it left running, can reach the store's token. Then reports the run.
  evidence:
    needs: [stage, visual]
    if: always() && needs.stage.outputs.agent == 'implement'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: factory
    permissions:
      contents: read
      # Authenticates to the console, as the stage job does.
      id-token: write
    env:
      RUN_ID: ${{ inputs.run_id }}
      CONSOLE_URL: ${{ inputs.console_url }}
    steps:
      - name: Get the report
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evidence-${{ inputs.run_id }}
          path: ${{ runner.temp }}/stage

      - name: Get the visual
        id: visual
        if: needs.visual.outputs.built == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: visual-${{ inputs.run_id }}
          path: ${{ runner.temp }}/visual

      - name: Upload the visual
        id: upload
        if: steps.visual.outcome == 'success'
        continue-on-error: true
        env:
          EVIDENCE_TOKEN: ${{ secrets.EVIDENCE_BLOB_READ_WRITE_TOKEN }}
          STORE: ${{ vars.EVIDENCE_BLOB_STORE_ID }}
        run: |
          visual="$RUNNER_TEMP/visual/files"
          mapfile -t files < <(find "$visual" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          # Each failure says which: the store ID is public (it's in the image URLs), the rest of the token never shows.
          [[ "$STORE" =~ ^[A-Za-z0-9]+$ ]] || { echo "::error::EVIDENCE_BLOB_STORE_ID is not set in the factory environment"; exit 1; }
          [[ -n "$EVIDENCE_TOKEN" ]] || { echo "::error::EVIDENCE_BLOB_READ_WRITE_TOKEN is empty: add it to the project's factory environment"; exit 1; }
          [[ "$EVIDENCE_TOKEN" =~ ^vercel_blob_rw_([A-Za-z0-9]+)_[^[:space:]\"\'=]+$ ]] || { echo "::error::EVIDENCE_BLOB_READ_WRITE_TOKEN isn't a bare Blob read-write token (vercel_blob_rw_<store>_<secret>, with nothing around it)"; exit 1; }
          store=${BASH_REMATCH[1]}
          [[ "$store" == "$STORE" ]] || { echo "::error::EVIDENCE_BLOB_READ_WRITE_TOKEN is for store $store, not $STORE (EVIDENCE_BLOB_STORE_ID)"; exit 1; }
          (( ${#files[@]} > 0 )) || { echo "::error::the visual job handed on no files"; exit 1; }
          # The visual job ran no agent, but read files one made: take only what it should have made.
          for name in "${files[@]}"; do
            file="$visual/$name"
            case "$name" in visual.png | poster.png) type=image/png ;; walkthrough.mp4) type=video/mp4 ;; *) echo "::error::$name isn't a visual"; exit 1 ;; esac
            [[ -f "$file" && ! -L "$file" ]] || { echo "::error::$name is not a regular file"; exit 1; }
            (( $(stat -c %s "$file") <= 50000000 )) || { echo "::error::$name is over 50 MB"; exit 1; }
          done
          for name in "${files[@]}"; do
            file="$visual/$name"
            case "$name" in *.png) type=image/png ;; *.mp4) type=video/mp4 ;; esac
            pathname=$(jq -rn --arg path "$GITHUB_REPOSITORY/$RUN_ID/$name" '$path | @uri')
            curl -sS --fail-with-body --retry 3 -o /dev/null -X PUT --data-binary @"$file" \
              -H "authorization: Bearer $EVIDENCE_TOKEN" -H 'x-api-version: 13' -H "x-vercel-blob-store-id: $store" \
              -H 'x-vercel-blob-access: public' -H 'x-add-random-suffix: 0' -H 'x-allow-overwrite: 1' \
              -H "x-content-type: $type" "https://vercel.com/api/blob/?pathname=$pathname"
            echo "Uploaded https://${store,,}.public.blob.vercel-storage.com/$GITHUB_REPOSITORY/$RUN_ID/$name"
          done
          echo "prefix=https://${store,,}.public.blob.vercel-storage.com/$GITHUB_REPOSITORY/$RUN_ID/" >> "$GITHUB_OUTPUT"
          if [[ -f "$visual/walkthrough.mp4" ]]; then echo "video=true" >> "$GITHUB_OUTPUT"; fi

      - name: Attach the walkthrough
        # GitHub plays only videos stored with it, so the PR's link to the Blob copy becomes a player. Whatever goes
        # wrong, the PR keeps the link, which works.
        if: steps.upload.outcome == 'success' && steps.upload.outputs.video == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.EVIDENCE_ATTACH_TOKEN }}
          PREFIX: ${{ steps.upload.outputs.prefix }}
        run: |
          visual="$RUNNER_TEMP/visual/files"
          [[ -n "$GH_TOKEN" ]] || { echo "::notice::EVIDENCE_ATTACH_TOKEN isn't set: the walkthrough stays a link"; exit 0; }
          pr=$(jq -r '.report.pr // empty' "$RUNNER_TEMP/stage/run-report.json")
          [[ "$pr" =~ ^[0-9]+$ ]] || { echo "::warning::The report names no PR: the walkthrough stays a link"; exit 0; }
          gh pr edit --help | grep -q -- --attach || { echo "::warning::This runner's gh can't attach files: the walkthrough stays a link"; exit 0; }
          # GitHub's limit for videos on free plans.
          (( $(stat -c %s "$visual/walkthrough.mp4") <= 10000000 )) || { echo "::warning::The walkthrough is over 10 MB: it stays a link"; exit 0; }
          link="[Watch the walkthrough](${PREFIX}walkthrough.mp4)"
          original="$RUNNER_TEMP/original-body.md"
          gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json body --jq .body > "$original"
          (( $(grep -cxF "$link" "$original") == 1 )) || { echo "::warning::The PR doesn't link the walkthrough on a line of its own: it stays a link"; exit 0; }
          # gh uploads the file and rewrites this reference to GitHub's URL, which plays when alone in its paragraph.
          awk -v link="$link" '$0 == link { print "![Walkthrough](./walkthrough.mp4)"; next } { print }' "$original" > "$visual/body.md"
          cd "$visual"
          if gh pr edit "$pr" -R "$GITHUB_REPOSITORY" --body-file body.md --attach ./walkthrough.mp4 \
            && ! gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json body --jq .body | grep -qF './walkthrough.mp4'; then
            echo "Attached the walkthrough to PR #$pr"
          else
            gh pr edit "$pr" -R "$GITHUB_REPOSITORY" --body-file "$original"
            echo "::warning::Couldn't attach the walkthrough: the PR keeps its link"
          fi

      - name: Report the run
        if: always()
        env:
          RECORDED: ${{ needs.visual.outputs.recorded }}
          UPLOADED: ${{ steps.upload.outcome }}
          PREFIX: ${{ steps.upload.outputs.prefix }}
        run: |
          report="$RUNNER_TEMP/stage/run-report.json"
          # The stage job ended before writing its report: the console records a run that never started.
          if ! jq -e . "$report" > /dev/null 2>&1; then
            mkdir -p "$(dirname "$report")"
            jq -n '{conclusion: "failure", report: null, events: []}' > "$report"
          fi
          # Only this job says where the visual is: whatever the agent wrote there goes. The image and video names are
          # the ones just uploaded; the title is text the console checks before showing it.
          jq 'if (.report | type) == "object" then del(.report.visual) else . end' "$report" > "$report.tmp" && mv "$report.tmp" "$report"
          if [[ "$UPLOADED" == success ]]; then
            files="$RUNNER_TEMP/visual/files"
            image=$([[ -f "$files/visual.png" ]] && echo visual.png || echo poster.png)
            video=$([[ -f "$files/walkthrough.mp4" ]] && echo walkthrough.mp4 || true)
            jq --arg prefix "$PREFIX" --arg image "$image" --arg video "$video" --slurpfile made "$RUNNER_TEMP/visual/visual.json" \
              'if (.report | type) == "object" then .report.visual = (
                {title: ($made[0].title | tostring), image: ($prefix + $image)}
                + (if $video != "" then {video: ($prefix + $video)} else {} end)
                + (if ($video != "" and ($made[0].seconds | type) == "number") then {seconds: $made[0].seconds} else {} end)
              ) else . end' "$report" > "$report.tmp" && mv "$report.tmp" "$report"
          elif [[ "$RECORDED" == true ]]; then
            # The PR already points at the visual, so say why it's broken; the work itself is unaffected.
            note=" The visual couldn’t be built or uploaded, so the PR’s image is broken (see the visual and evidence jobs)."
            jq --arg note "$note" 'if (.report | type) == "object"
              then .report.summary = ((.report.summary // "") + $note) else . end' \
              "$report" > "$report.tmp" && mv "$report.tmp" "$report"
          fi

          audience=$(jq -rn --arg url "$CONSOLE_URL" '$url | @uri')
          oidc=$(curl -sS --fail-with-body --retry 3 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" | jq -r .value)
          echo "::add-mask::$oidc"
          curl -sS --fail-with-body -X POST -H "Authorization: Bearer $oidc" -H 'Content-Type: application/json' \
            --data @"$report" "$CONSOLE_URL/api/runs/$RUN_ID/report"
